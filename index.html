<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // 注册时【不带版本号】：sw.js 脚本 URL 固定，浏览器每次导航都会自动检查更新，
    // 彻底摆脱「旧 index.html 死守 sw.js?v=xxx，导致新代码永远拉不下来」的死循环
    navigator.serviceWorker.register('sw.js').catch(function () {});
    // 清掉历史上残留的「带版本号旧 SW 注册」，避免两个注册互相打架
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) {
        var u = (r.scriptURL || '');
        if (u.indexOf('/sw.js') !== -1 && u.indexOf('?v=') !== -1) r.unregister();
      });
    }).catch(function(){});
    // SW 更新后自动刷新一次，确保用户看到最新代码（避免一直被旧缓存困住）
    // 但等开场「破土枝丫」动画播完再刷新，避免打断入场动画
    var _swReloading = false, _swPending = false;
    var _doReload = function () {
      _swReloading = true;
      try { sessionStorage.setItem('__swReload', '1'); } catch (e) {}
      location.reload();
    };
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (_swReloading) return;
      if (document.getElementById('splash')) { _swPending = true; return; }
      _doReload();
    });
    window.addEventListener('splashDone', function () {
      if (_swPending && !_swReloading) _doReload();
    });
  }
  window.addEventListener('load', function () {
    var sp = document.getElementById('splash');
    if (!sp) return;
    // 显示当前时间（HH:mm）
    var elTime = document.getElementById('splashTime');
    if (elTime) {
      var d = new Date();
      var hh = d.getHours(), mm = d.getMinutes();
      elTime.textContent = (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
    }
    // 如果这次是 SW 更新后自动刷新回来的，跳过开场动画（避免连播两次）
    var skip = false;
    try { skip = sessionStorage.getItem('__swReload') === '1'; sessionStorage.removeItem('__swReload'); } catch (e) {}
    if (skip) { sp.remove(); window.dispatchEvent(new Event('splashDone')); return; }
    setTimeout(function () { sp.classList.add('hide'); setTimeout(function () { sp.remove(); window.dispatchEvent(new Event('splashDone')); }, 500); }, 1500);
  });
</script>
